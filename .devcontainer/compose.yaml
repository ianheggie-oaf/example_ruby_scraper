name: "example_ruby_scraper"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    environment:
      CHROME_NO_SANDBOX: "1"
      MALLOC_ARENA_MAX: "2"
    mem_limit: 5g
    volumes:
    - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Use the non-root user set up in the devcontainer rails image (id 1000) so files are not owned by root
    user: vscode

