# Minimal compose file.
#
# scraper: what morph.io generates when a scraper sets memory_mb in its
# configuration - without that, morph can just build and run the Dockerfile
# directly (docker build / docker run), no compose file involved at all.
services:
  scraper:
    build:
      context: .
    volumes:
      - .:/app
    # Hard memory cap, corresponding to memory_mb: 200 in the scraper's
    # configuration. Using mem_limit rather than deploy.resources.limits -
    # the latter depends on newer Compose V2 behaviour that isn't reliably
    # present on older Docker installs (morph's included).
    mem_limit: 200M

